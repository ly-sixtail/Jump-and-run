<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>슈퍼 코인 러너</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0a2e;display:flex;flex-direction:column;align-items:center;padding:10px 0;font-family:'Courier New',monospace;}
#hud{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;justify-content:center;}
#hud span{background:#000;border:2px solid #f9c;border-radius:8px;padding:3px 10px;color:#fff;font-size:12px;font-weight:bold;}
#hud span b{color:#ff0;}
#cW{position:relative;}
#gc{display:block;border:4px solid #f9c;border-radius:6px;cursor:pointer;}
.ov{position:absolute;inset:0;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20;padding:10px;}
.ov h1{font-size:26px;color:#f9c;text-shadow:2px 2px #800;margin-bottom:6px;}
.ov h2{font-size:20px;color:#ff0;margin-bottom:10px;}
.ov p{font-size:11px;color:#bbb;margin-bottom:4px;}
.btn{margin:4px;padding:8px 18px;font-size:13px;font-family:'Courier New',monospace;background:linear-gradient(180deg,#c33,#811);border:3px solid #f9c;border-radius:8px;color:#fff;cursor:pointer;transition:transform 0.1s;}
.btn:hover{transform:scale(1.05);}
.btn.bl{background:linear-gradient(180deg,#48f,#06a);border-color:#9cf;}
.btn.gr{background:linear-gradient(180deg,#4c4,#181);border-color:#9f9;}
.btn.yl{background:linear-gradient(180deg,#fa0,#a60);border-color:#ff0;}
input[type=text]{background:#111;border:2px solid #f9c;border-radius:8px;color:#fff;font-size:15px;padding:8px 14px;font-family:'Courier New',monospace;text-align:center;width:200px;margin:8px 0;outline:none;}
input[type=text]:focus{border-color:#ff0;}
.cgrid{display:flex;gap:8px;margin:8px 0;}
.cc{border:2px solid #555;border-radius:10px;padding:6px 10px;text-align:center;background:rgba(255,255,255,0.07);cursor:pointer;transition:all 0.12s;}
.cc:hover{border-color:#f9c;}.cc.on{border-color:#ff0;background:rgba(255,255,0,0.08);}
.cc p{font-size:10px;color:#eee;margin-top:4px;}
.shop-tabs{display:flex;gap:4px;margin-bottom:8px;}
.stab{padding:5px 12px;font-size:11px;background:#333;border:2px solid #555;border-radius:6px;color:#ccc;cursor:pointer;}
.stab.on{background:#444;border-color:#f9c;color:#fff;}
.sgrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:580px;max-height:165px;overflow-y:auto;}
.si{border:2px solid #555;border-radius:8px;padding:6px;text-align:center;background:rgba(255,255,255,0.06);cursor:pointer;width:95px;transition:all 0.12s;}
.si:hover{border-color:#ff0;}.si.owned{border-color:#4f4;}.si.eq{border-color:#4af;background:rgba(0,180,255,0.1);}
.si p{font-size:10px;color:#eee;margin-top:3px;}.si .pr{font-size:9px;color:#ff0;}
.nick-badge{font-size:12px;color:#f9c;margin-bottom:4px;}
</style>
</head>
<body>
<div id="hud">
  <span id="nickHud"></span>
  <span>점수: <b id="sS">0</b></span>
  <span>코인: <b id="sC">0</b></span>
  <span>총코인: <b id="sT">0</b></span>
  <span>최고: <b id="sH">0</b></span>
</div>
<div id="cW">
  <canvas id="gc" width="800" height="300"></canvas>

  <!-- 로그인 -->
  <div class="ov" id="oLogin">
    <h1>⭐ 슈퍼 코인 러너</h1>
    <p style="color:#ff0;font-size:13px;margin-bottom:10px;">닉네임으로 로그인하면 코인·의상이 저장돼요!</p>
    <input type="text" id="nickInput" placeholder="닉네임 (2~10자)" maxlength="10"/>
    <button class="btn gr" style="font-size:15px;margin-top:6px;" onclick="doLogin()">▶ 입장!</button>
    <p style="margin-top:6px;color:#777;font-size:10px;">같은 닉네임으로 다시 오면 데이터가 남아 있어요</p>
  </div>

  <!-- 캐릭터 선택 -->
  <div class="ov" id="oStart" style="display:none;">
    <h1>⭐ 슈퍼 코인 러너</h1>
    <p class="nick-badge" id="startNick"></p>
    <p style="font-size:11px;color:#aaa;">캐릭터를 고르세요</p>
    <div class="cgrid" id="charGrid"></div>
    <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:center;">
      <button class="btn gr" style="font-size:14px;" onclick="startGame()">▶ 시작!</button>
      <button class="btn yl" onclick="openShop()">🛍 상점</button>
      <button class="btn" style="font-size:11px;" onclick="doLogout()">로그아웃</button>
    </div>
    <p style="margin-top:4px;font-size:9px;color:#777;">스페이스 / 위 방향키 / 클릭으로 점프</p>
  </div>

  <!-- 게임 오버 -->
  <div class="ov" id="oOver" style="display:none;">
    <h2 id="overTitle">💀 게임 오버!</h2>
    <p id="overScore"></p>
    <p id="overHigh" style="color:#ff0;font-size:12px;"></p>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center;">
      <button class="btn gr" onclick="startGame()">🔄 다시 시작</button>
      <button class="btn yl" onclick="openShop()">🛍 상점</button>
      <button class="btn bl" onclick="goMain()">🏠 메인</button>
    </div>
  </div>

  <!-- 상점 -->
  <div class="ov" id="oShop" style="display:none;">
    <h2>🛍 의상 상점</h2>
    <p id="shopCoins" style="color:#ff0;font-size:13px;margin-bottom:6px;"></p>
    <div class="shop-tabs" id="shopTabs"></div>
    <div class="sgrid" id="shopGrid"></div>
    <button class="btn" style="margin-top:8px;" onclick="closeShop()">← 돌아가기</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, GY = 220;

// ── 프로필 저장소 ────────────────────────────────
const profiles = new Map();
let curNick = '', curProf = null;
let running = false, score = 0, totalCoins = 0, sesCoins = 0, hiScore = 0;
let frame = 0, spd = 4, charIdx = 0, bgX = 0;
let obs = [], coins = [], parts = [], clouds = [], bgBirds = [];

// ── 캐릭터 정의 ──────────────────────────────────
const CHARS = [
  { name:'남자1', gender:'m', skin:'#fca', hairColor:'#2a2010', hairType:'straight',      label:'직모'   },
  { name:'남자2', gender:'m', skin:'#fca', hairColor:'#3a2810', hairType:'curly',         label:'곱슬'   },
  { name:'여자1', gender:'f', skin:'#fdd', hairColor:'#1a1000', hairType:'long_straight', label:'긴직모' },
  { name:'여자2', gender:'f', skin:'#fdd', hairColor:'#5a3520', hairType:'curly_medium',  label:'곱슬'   },
];

// ── 상점 아이템 ───────────────────────────────────
const ITEMS = [
  { id:'tshirt',    name:'흰 티셔츠', slot:'top',    price:0,    col:'#eee',    desc:'기본'       },
  { id:'suit',      name:'양복',      slot:'top',    price:500,  col:'#2a3a5a', desc:'정장 재킷'  },
  { id:'jumper',    name:'점퍼',      slot:'top',    price:350,  col:'#c03000', desc:'캐주얼'     },
  { id:'hoodie',    name:'후디',      slot:'top',    price:280,  col:'#4a6080', desc:'후드 티'    },
  { id:'jeans',     name:'청바지',    slot:'bottom', price:0,    col:'#3355aa', desc:'기본'       },
  { id:'skirt',     name:'스커트',    slot:'bottom', price:300,  col:'#dd55aa', gender:'f', desc:'플리츠' },
  { id:'leggings',  name:'레깅스',    slot:'bottom', price:200,  col:'#553388', gender:'f', desc:'컬러'  },
  { id:'slacks',    name:'슬랙스',    slot:'bottom', price:250,  col:'#334455', gender:'m', desc:'깔끔'  },
  { id:'redcap',    name:'빨간 캡',   slot:'hat',    price:150,  col:'#cc2200', desc:'스포티'     },
  { id:'beret',     name:'베레모',    slot:'hat',    price:180,  col:'#224400', desc:'감성'       },
  { id:'fedora',    name:'페도라',    slot:'hat',    price:280,  col:'#332200', desc:'클래식'     },
  { id:'pink_bow',  name:'핑크 리본', slot:'hat',    price:130,  col:'#ff88bb', gender:'f', desc:'귀여운' },
  { id:'hair_alt',  name:'헤어 변경', slot:'hair',   price:100,  col:'#8855cc', desc:'새 스타일'  },
  { id:'hair_color',name:'헤어 컬러', slot:'hair',   price:200,  col:'#cc3388', desc:'염색'       },
];
const SLOT_NAMES = { top:'👔 상의', bottom:'👖 하의', hat:'🎩 모자', hair:'💇 헤어' };
let shopTab = 'top';

// ── 프로필 관리 ───────────────────────────────────
function getProfile(nick) {
  if (!profiles.has(nick)) {
    profiles.set(nick, {
      coins: 80, hiScore: 0, charIdx: 0,
      owned: new Set(['tshirt', 'jeans']),
      eq: { top:'tshirt', bottom:'jeans', hat:'none', hair:'default' }
    });
  }
  return profiles.get(nick);
}
function saveProfile() {
  if (!curProf) return;
  curProf.coins   = totalCoins;
  curProf.hiScore = hiScore;
  curProf.charIdx = charIdx;
}

function doLogin() {
  const nick = document.getElementById('nickInput').value.trim();
  if (nick.length < 2) { alert('닉네임은 2자 이상이어야 해요!'); return; }
  curNick = nick; curProf = getProfile(nick);
  totalCoins = curProf.coins; hiScore = curProf.hiScore; charIdx = curProf.charIdx;
  document.getElementById('oLogin').style.display  = 'none';
  document.getElementById('oStart').style.display  = 'flex';
  document.getElementById('startNick').textContent = '👤 ' + curNick;
  document.getElementById('nickHud').innerHTML     = '👤 <b>' + curNick + '</b>';
  buildCharGrid(); updateHUD(); idleLoop();
}
function doLogout() {
  saveProfile(); running = false; curNick = ''; curProf = null;
  document.getElementById('oStart').style.display = 'none';
  document.getElementById('oLogin').style.display = 'flex';
  document.getElementById('nickInput').value = '';
}

// ── 조작 이벤트 ───────────────────────────────────
const pl = { x:80, y:GY, w:28, h:40, vy:0, grav:0.85, jp:-12, onG:true, dj:false };

function jump() {
  if (pl.onG)      { pl.vy = pl.jp;       pl.onG = false; pl.dj = true;  }
  else if (pl.dj)  { pl.vy = pl.jp * 0.82; pl.dj = false; }
}
document.addEventListener('keydown', e => {
  if (!running) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('click',      () => { if (running) jump(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (running) jump(); }, { passive: false });
document.getElementById('nickInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── 물리 ─────────────────────────────────────────
function updatePlayer() {
  pl.vy += pl.grav; pl.y += pl.vy;
  if (pl.y >= GY) { pl.y = GY; pl.vy = 0; pl.onG = true; pl.dj = false; return; }
  let onC = false;
  for (const c of clouds) {
    if (pl.vy >= 0 && pl.x+4+pl.w-8 > c.x+4 && pl.x+4 < c.x+c.w-4 && pl.y >= c.y && pl.y <= c.y+14) {
      pl.y = c.y; pl.vy = 0; pl.onG = true; pl.dj = false; onC = true; break;
    }
  }
  if (!onC && pl.y < GY) pl.onG = false;
}

// ── 장애물 ───────────────────────────────────────
function spawnObs() {
  const r = Math.random();
  if      (r < 0.35) obs.push({ x:W+10, y:GY-28+8,                      w:28, h:28, type:'mole'   });
  else if (r < 0.65) obs.push({ x:W+10, y:GY-22+8,                      w:36, h:22, type:'stone'  });
  else               obs.push({ x:W+10, y:GY-110-Math.random()*60,       w:36, h:22, type:'bird_ob', wing:0, wd:1 });
}
function updateObs() {
  spd += 0.001;
  if (frame % Math.max(55, 110 - Math.floor(score/30)*3) === 0) spawnObs();
  for (let i = obs.length-1; i >= 0; i--) {
    const o = obs[i]; o.x -= spd;
    if (o.type === 'bird_ob') { o.wing += 0.2*o.wd; if (Math.abs(o.wing) > 1) o.wd *= -1; }
    if (o.x + o.w < 0) obs.splice(i, 1);
  }
}

// ── 구름 플랫폼 (계단형) ─────────────────────────
function spawnCloudStairs() {
  const steps = 3 + Math.floor(Math.random()*3);
  const sx = W+20, sy = GY-75, sX = 62, sY = 50;
  for (let k = 0; k < steps; k++) {
    const bx = sx + k*sX, by = sy - k*sY;
    if (by < 15) break;
    clouds.push({ x:bx, y:by, w:60, h:18 });
    coins.push({ x:bx+30, y:by-20, r:9, vy:0 });
  }
}
function updateClouds() {
  if (frame % 210 === 80) spawnCloudStairs();
  for (let i = clouds.length-1; i >= 0; i--) { clouds[i].x -= spd; if (clouds[i].x + clouds[i].w < 0) clouds.splice(i, 1); }
}

// ── 배경 새 (장식) ───────────────────────────────
function updateBgBirds() {
  if (frame % 380 === 0 && Math.random() < 0.7) bgBirds.push({ x:W+30, y:18+Math.random()*60, sp:1.2+Math.random()*1.5, wing:0, wd:1 });
  for (let i = bgBirds.length-1; i >= 0; i--) {
    const b = bgBirds[i]; b.x -= b.sp + spd*0.15;
    b.wing += 0.12*b.wd; if (Math.abs(b.wing) > 1) b.wd *= -1;
    if (b.x < -40) bgBirds.splice(i, 1);
  }
}

// ── 코인 ─────────────────────────────────────────
function spawnCoin() {
  const y = Math.random() < 0.5 ? GY-22 : GY-60-Math.random()*60;
  coins.push({ x:W+10, y, r:9, vy:0 });
}
function updateCoins() {
  if (frame % 80 === 0) spawnCoin();
  for (let i = coins.length-1; i >= 0; i--) {
    const c = coins[i]; c.x -= spd;
    if (c.vy) { c.vy += 0.4; c.y += c.vy; if (c.vy > 0 && c.y > GY-10) { coins.splice(i,1); continue; } }
    if (c.x < -20) { coins.splice(i,1); continue; }
    if (Math.hypot(c.x-(pl.x+14), c.y-(pl.y-35)) < c.r+18) {
      sesCoins++; totalCoins++; score += 10; addParts(c.x, c.y, '#ff0', 7); coins.splice(i,1);
    }
  }
}

// ── 충돌 판정 ────────────────────────────────────
function checkCol() {
  const pb = { x:pl.x+6, y:pl.y-pl.h+4, w:pl.w-10, h:pl.h-4 };
  for (const o of obs) {
    if (pb.x < o.x+o.w-3 && pb.x+pb.w > o.x+3 && pb.y < o.y+o.h && pb.y+pb.h > o.y)
      return o.type === 'bird_ob' ? '🐦 새에 부딧혔어요!' : '💀 장애물에 부딧혔어요!';
  }
  return null;
}

// ── 파티클 ───────────────────────────────────────
function addParts(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI*2*i/n;
    parts.push({ x, y, vx:Math.cos(a)*(1.5+Math.random()*3), vy:Math.sin(a)*(1.5+Math.random()*3)-2, col, life:28, max:28 });
  }
}
function updateParts() {
  for (let i = parts.length-1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) parts.splice(i,1); }
}

// ── 캐릭터 그리기 ────────────────────────────────
function getEq() { return curProf ? curProf.eq : { top:'tshirt', bottom:'jeans', hat:'none', hair:'default' }; }

function drawHair(cx, px, fy, ch, hairStyle, s) {
  const hc = hairStyle === 'hair_color' ? '#e03080' : ch.hairColor;
  const alt = hairStyle === 'hair_alt' || hairStyle === 'hair_color';
  cx.fillStyle = hc;
  if (ch.hairType === 'straight') {
    if (!alt) {
      cx.fillRect(px-10*s, fy-54*s, 20*s, 10*s);
      cx.fillRect(px-11*s, fy-50*s,  5*s,  8*s);
      cx.fillRect(px+ 6*s, fy-50*s,  5*s,  8*s);
    } else {
      cx.fillRect(px- 9*s, fy-56*s, 18*s, 6*s);
      cx.fillRect(px+ 4*s, fy-57*s,  6*s, 16*s);
    }
  } else if (ch.hairType === 'curly') {
    const r = alt ? 10 : 8, cnt = alt ? 8 : 6, sz = alt ? 6 : 5;
    for (let k = 0; k < cnt; k++) { const a = k/cnt*Math.PI*2; cx.beginPath(); cx.arc(px+Math.cos(a)*r*s, fy-52*s+Math.sin(a)*(alt?5:3)*s, sz*s, 0, Math.PI*2); cx.fill(); }
  } else if (ch.hairType === 'long_straight') {
    cx.fillRect(px-11*s, fy-56*s, 22*s, 8*s);
    if (!alt) {
      cx.fillRect(px-12*s, fy-56*s, 5*s, 34*s);
      cx.fillRect(px+ 7*s, fy-56*s, 5*s, 34*s);
    } else {
      cx.fillRect(px-12*s, fy-56*s, 5*s, 20*s);
      cx.fillRect(px+ 7*s, fy-56*s, 8*s, 32*s);
      cx.fillStyle = '#f9c'; cx.beginPath(); cx.arc(px+11*s, fy-37*s, 4*s, 0, Math.PI*2); cx.fill(); cx.fillStyle = hc;
    }
  } else if (ch.hairType === 'curly_medium') {
    cx.fillRect(px-11*s, fy-56*s, 22*s, 6*s);
    const cnt = alt ? 8 : 7, r = alt ? 10 : 9, sz = alt ? 6 : 5.5;
    for (let k = 0; k < cnt; k++) { const a = k/cnt*Math.PI*2; cx.beginPath(); cx.arc(px+Math.cos(a)*r*s, fy-52*s+Math.sin(a)*(alt?5:4)*s, sz*s, 0, Math.PI*2); cx.fill(); }
    const side = alt ? 5 : 2;
    for (let k = 0; k < side; k++) { cx.beginPath(); cx.arc(px-11*s, fy-(44-k*6)*s, 4*s, 0, Math.PI*2); cx.fill(); cx.beginPath(); cx.arc(px+11*s, fy-(44-k*6)*s, 4*s, 0, Math.PI*2); cx.fill(); }
  }
}

function drawHat(cx, px, fy, hat, s) {
  if (hat === 'redcap') {
    cx.fillStyle = '#cc2200'; cx.fillRect(px-13*s, fy-62*s, 26*s, 5*s); cx.fillRect(px-9*s, fy-72*s, 18*s, 12*s);
    cx.fillStyle = '#fff'; cx.fillRect(px-3*s, fy-65*s, 6*s, 3*s);
  } else if (hat === 'beret') {
    cx.fillStyle = '#224400'; cx.beginPath(); cx.ellipse(px+4*s, fy-62*s, 16*s, 10*s, -0.3, 0, Math.PI*2); cx.fill();
    cx.fillRect(px-9*s, fy-60*s, 2*s, 4*s);
  } else if (hat === 'fedora') {
    cx.fillStyle = '#332200'; cx.fillRect(px-16*s, fy-60*s, 32*s, 5*s); cx.fillRect(px-9*s, fy-72*s, 18*s, 14*s);
    cx.fillStyle = '#554400'; cx.fillRect(px-8*s, fy-61*s, 16*s, 3*s);
  } else if (hat === 'pink_bow') {
    cx.fillStyle = '#ff88bb';
    cx.beginPath(); cx.ellipse(px-6*s, fy-64*s, 8*s, 5*s,  0.3, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(px+6*s, fy-64*s, 8*s, 5*s, -0.3, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(px, fy-64*s, 4*s, 0, Math.PI*2); cx.fill();
  }
}

function drawCharFull(cx, px, fy, cIdx, eq, s) {
  s = s || 1;
  const hw = 13*s, ch = CHARS[cIdx];
  const eqTop  = eq ? eq.top    : 'tshirt';
  const eqBot  = eq ? eq.bottom : 'jeans';
  const eqHat  = eq ? eq.hat    : 'none';
  const eqHair = eq ? eq.hair   : 'default';
  const topCol = { tshirt:'#eee', suit:'#2a3a5a', jumper:'#c03000', hoodie:'#4a6080' }[eqTop] || '#eee';
  const botCol = { jeans:'#3355aa', skirt:'#dd55aa', leggings:'#553388', slacks:'#334455' }[eqBot] || '#3355aa';

  // 신발
  cx.fillStyle = '#433'; cx.fillRect(px-hw, fy-8*s, hw-1, 8*s); cx.fillRect(px+1, fy-8*s, hw-1, 8*s);
  // 하의
  cx.fillStyle = botCol;
  if (eqBot === 'skirt') {
    cx.beginPath(); cx.moveTo(px-hw+2, fy-18*s); cx.lineTo(px-hw-5, fy-8*s); cx.lineTo(px+hw+5, fy-8*s); cx.lineTo(px+hw-2, fy-18*s); cx.closePath(); cx.fill();
    cx.fillStyle = ch.skin; cx.fillRect(px-5*s, fy-12*s, 10*s, 5*s);
  } else {
    cx.fillRect(px-hw+2, fy-18*s, hw*2-4, 10*s);
  }
  // 상의
  cx.fillStyle = topCol; cx.fillRect(px-hw+2, fy-32*s, hw*2-4, 14*s);
  if (eqTop === 'suit')   { cx.fillStyle='#fff'; cx.fillRect(px-3*s,fy-32*s,6*s,12*s); cx.fillStyle='#c00'; cx.fillRect(px-1.5*s,fy-30*s,3*s,9*s); }
  if (eqTop === 'jumper') { cx.fillStyle='rgba(255,255,255,0.2)'; cx.fillRect(px-hw+3,fy-32*s,7*s,14*s); cx.fillRect(px+4*s,fy-32*s,7*s,14*s); }
  if (eqTop === 'hoodie') { cx.fillStyle='rgba(0,0,0,0.2)'; cx.beginPath(); cx.arc(px,fy-32*s,6*s,0,Math.PI); cx.fill(); }
  // 얼굴
  cx.fillStyle = ch.skin; cx.beginPath(); cx.arc(px, fy-44*s, 11*s, 0, Math.PI*2); cx.fill();
  // 눈
  cx.fillStyle = '#000'; cx.fillRect(px-6*s,fy-42*s,3*s,3*s); cx.fillRect(px+3*s,fy-42*s,3*s,3*s);
  if (ch.gender === 'f') { cx.fillRect(px-7*s,fy-44*s,3*s,1.5*s); cx.fillRect(px+3*s,fy-44*s,4*s,1.5*s); }
  // 헤어 & 모자
  drawHair(cx, px, fy, ch, eqHair, s);
  if (eqHat && eqHat !== 'none') drawHat(cx, px, fy, eqHat, s);
}

// ── 배경 그리기 ───────────────────────────────────
function drawBg() {
  const g = ctx.createLinearGradient(0,0,0,GY); g.addColorStop(0,'#5cf'); g.addColorStop(1,'#aef');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,GY+8);
  [60,260,490,720].forEach((ox,i) => {
    const cx2=((ox-bgX*0.12)%(W+200)+W+200)%(W+200)-100, cy2=[28,42,33,50][i], sz=[50,65,45,60][i];
    ctx.fillStyle='rgba(255,255,255,0.9)';
    [[0,0],[sz*0.28,5],[sz*-0.22,8]].forEach(([dx,dy],j)=>{ctx.beginPath();ctx.arc(cx2+dx,cy2+dy,[sz*0.32,sz*0.25,sz*0.2][j],0,Math.PI*2);ctx.fill();});
  });
  [{ox:0,w:200},{ox:260,w:155},{ox:480,w:215},{ox:710,w:170}].forEach(d=>{
    const hx=((d.ox-bgX*0.25)%(W+300)+W+300)%(W+300)-150;
    ctx.fillStyle='#3a8'; ctx.beginPath(); ctx.arc(hx+d.w/2,GY+18,d.w/2,Math.PI,0); ctx.fill();
    ctx.fillStyle='#2c6'; for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(hx+d.w*0.25+k*d.w*0.25,GY-13,4,0,Math.PI*2);ctx.fill();}
  });
  ctx.fillStyle='#5a3'; ctx.fillRect(0,GY+8,W,H-GY-8);
  ctx.fillStyle='#4b2'; ctx.fillRect(0,GY,W,12);
  ctx.fillStyle='#6c4'; const bw=40, bo=(bgX*0.8)%bw;
  for (let x=-bw+bo; x<W+bw; x+=bw) ctx.fillRect(x,GY,bw-2,10);
}
function drawBgBirds() {
  bgBirds.forEach(b=>{
    ctx.fillStyle='rgba(70,70,70,0.55)';
    ctx.beginPath();ctx.ellipse(b.x,b.y,8,4,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(b.x-8,b.y-b.wing*5,7,3,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(b.x+8,b.y-b.wing*5,7,3,0.3,0,Math.PI*2);ctx.fill();
  });
}
function drawCloudPlatforms() {
  clouds.forEach(c=>{
    ctx.fillStyle='rgba(255,255,255,0.96)';
    ctx.beginPath();ctx.arc(c.x+14,c.y+7,13,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(c.x+30,c.y+3,16,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(c.x+46,c.y+8,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(210,235,255,0.7)';ctx.fillRect(c.x+4,c.y+7,c.w-8,11);
  });
}
function drawCoin(c) {
  const p=Math.sin(frame*0.12+c.x*0.05)*1.5;
  ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(c.x,c.y,c.r+p*0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fa0';ctx.beginPath();ctx.arc(c.x-2,c.y-2,c.r*0.4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#a60';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,c.r+p*0.3,0,Math.PI*2);ctx.stroke();
}
function drawObs(o) {
  if (o.type==='mole') {
    const mx=o.x+14,my=o.y+o.h;
    ctx.fillStyle='#654';ctx.beginPath();ctx.arc(mx,my-16,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#987';ctx.beginPath();ctx.ellipse(mx,my-10,8,5,0,0,Math.PI);ctx.fill();
    ctx.fillStyle='#f99';ctx.beginPath();ctx.arc(mx,my-16,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(mx-4,my-18,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(mx+4,my-18,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillRect(mx-6,my-9,3,8);ctx.fillRect(mx+3,my-9,3,8);
    ctx.fillStyle='#432';ctx.beginPath();ctx.ellipse(mx,my,15,5,0,0,Math.PI*2);ctx.fill();
  } else if (o.type==='stone') {
    ctx.fillStyle='#888';ctx.beginPath();ctx.moveTo(o.x+4,o.y+o.h);ctx.lineTo(o.x,o.y+o.h);ctx.lineTo(o.x+2,o.y+3);ctx.lineTo(o.x+o.w-2,o.y+1);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();
    ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(o.x+11,o.y+7,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(o.x+22,o.y+10,3,0,Math.PI*2);ctx.fill();
  } else {
    const bx=o.x+18,by=o.y+11;
    ctx.fillStyle='#d33';ctx.beginPath();ctx.ellipse(bx,by,13,7,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx-12,by-o.wing*7,11,5,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx+12,by-o.wing*7,11,5,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx+9,by-2,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bx+10,by-2,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.moveTo(bx+22,by);ctx.lineTo(bx+17,by-2);ctx.lineTo(bx+17,by+2);ctx.fill();
    ctx.fillStyle='rgba(255,50,50,0.22)';ctx.beginPath();ctx.arc(bx,by,22,0,Math.PI*2);ctx.fill();
  }
}

// ── 메인 루프 ────────────────────────────────────
function updateHUD() {
  document.getElementById('sS').textContent = score;
  document.getElementById('sC').textContent = sesCoins;
  document.getElementById('sT').textContent = totalCoins;
  document.getElementById('sH').textContent = hiScore;
}
function update() {
  bgX += spd; frame++;
  updatePlayer(); updateObs(); updateClouds(); updateBgBirds(); updateCoins(); updateParts();
  const hit = checkCol(); if (hit) { endGame(hit); return; }
  updateHUD();
}
function draw() {
  ctx.clearRect(0,0,W,H); drawBg(); drawBgBirds(); drawCloudPlatforms();
  obs.forEach(drawObs); coins.forEach(drawCoin);
  parts.forEach(p=>{ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.col;ctx.fillRect(p.x-3,p.y-3,6,6);});
  ctx.globalAlpha=1;
  const eq=getEq(), by2=pl.onG?Math.sin(frame*0.22)*2:0;
  drawCharFull(ctx, pl.x+14, pl.y+by2, charIdx, eq, 1);
}
function gameLoop() { if(!running)return; update(); draw(); requestAnimationFrame(gameLoop); }
function idleLoop() {
  if(running)return;
  ctx.clearRect(0,0,W,H); bgX+=0.8; drawBg(); drawBgBirds();
  drawCharFull(ctx, pl.x+14, GY+Math.sin(Date.now()*0.004)*3, charIdx, getEq(), 1);
  requestAnimationFrame(idleLoop);
}

// ── 게임 흐름 ────────────────────────────────────
function startGame() {
  score=0;sesCoins=0;frame=0;spd=4;obs=[];coins=[];parts=[];clouds=[];bgBirds=[];
  pl.x=80;pl.y=GY;pl.vy=0;pl.onG=true;pl.dj=false;
  ['oStart','oOver','oShop'].forEach(id=>document.getElementById(id).style.display='none');
  updateHUD(); running=true; gameLoop();
}
function endGame(reason) {
  running=false; addParts(pl.x+14,pl.y-20,'#f44',14);
  if(score>hiScore)hiScore=score; saveProfile();
  document.getElementById('overTitle').textContent = reason;
  document.getElementById('overScore').textContent = `점수: ${score} | 코인: ${sesCoins} | 총: ${totalCoins}`;
  document.getElementById('overHigh').textContent  = score===hiScore?'🏆 최고 기록 갱신!':`최고 기록: ${hiScore}`;
  document.getElementById('oOver').style.display='flex'; updateHUD(); idleLoop();
}
function goMain() {
  running=false; saveProfile();
  ['oOver','oShop'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('oStart').style.display='flex'; buildCharGrid(); idleLoop();
}

// ── 상점 ─────────────────────────────────────────
function openShop() {
  ['oOver','oStart'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('oShop').style.display='flex'; shopTab='top'; buildShop();
}
function closeShop() {
  document.getElementById('oShop').style.display='none';
  document.getElementById('oStart').style.display='flex';
}
function buildShop() {
  if (!curProf) return;
  document.getElementById('shopCoins').textContent = `보유 코인: ${totalCoins} 개`;
  const ch = CHARS[charIdx];
  const tabs = document.getElementById('shopTabs'); tabs.innerHTML='';
  ['top','bottom','hat','hair'].forEach(sl=>{
    const t=document.createElement('div'); t.className='stab'+(sl===shopTab?' on':'');
    t.textContent=SLOT_NAMES[sl]; t.onclick=()=>{shopTab=sl;buildShop();}; tabs.appendChild(t);
  });
  const grid=document.getElementById('shopGrid'); grid.innerHTML='';
  ITEMS.filter(it=>it.slot===shopTab&&(!it.gender||it.gender===ch.gender)).forEach(it=>{
    const ow=curProf.owned.has(it.id)||it.price===0, ac=curProf.eq[it.slot]===it.id;
    const div=document.createElement('div'); div.className='si'+(ow?' owned':'')+(ac?' eq':'');
    const pc=document.createElement('canvas'); pc.width=44; pc.height=60;
    const previewEq={...curProf.eq,[it.slot]:it.id};
    if(it.slot==='hat')previewEq.hat=it.id;
    drawCharFull(pc.getContext('2d'),22,57,charIdx,previewEq,0.75); div.appendChild(pc);
    const nm=document.createElement('p'); nm.textContent=it.name; div.appendChild(nm);
    const pr=document.createElement('p'); pr.className='pr'; pr.textContent=ac?'✅ 착용중':ow?'착용하기':`💰 ${it.price}`; div.appendChild(pr);
    div.onclick=()=>{
      if(!ow){if(totalCoins>=it.price){totalCoins-=it.price;curProf.owned.add(it.id);curProf.eq[it.slot]=it.id;saveProfile();buildShop();updateHUD();}else alert(`코인 부족! (필요: ${it.price}, 보유: ${totalCoins})`);}
      else{curProf.eq[it.slot]=it.id;buildShop();}
    };
    grid.appendChild(div);
  });
}
function buildCharGrid() {
  const grid=document.getElementById('charGrid'); grid.innerHTML='';
  CHARS.forEach((ch,i)=>{
    const div=document.createElement('div'); div.className='cc'+(i===charIdx?' on':'');
    const pc=document.createElement('canvas'); pc.width=44; pc.height=60;
    drawCharFull(pc.getContext('2d'),22,57,i,getEq(),0.75); div.appendChild(pc);
    const nm=document.createElement('p'); nm.textContent=ch.name; div.appendChild(nm);
    const lb=document.createElement('p'); lb.textContent=ch.label; lb.style.color='#aaa'; div.appendChild(lb);
    div.onclick=()=>{charIdx=i;if(curProf)curProf.charIdx=i;document.querySelectorAll('.cc').forEach((el,j)=>el.classList.toggle('on',j===i));buildCharGrid();};
    grid.appendChild(div);
  });
}
updateHUD();
</script>
